<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>make.fun – Earn Real USDC with AI Agents</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ff4d9e, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 1.35rem;
      color: #d1d5db;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .description {
      font-size: 1.1rem;
      color: #9ca3af;
      max-width: 520px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    .cta {
      display: inline-block;
      background: #ff4d9e;
      color: white;
      padding: 16px 42px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.15rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 77, 158, 0.3);
    }

    .cta:hover {
      background: #e63d8c;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 77, 158, 0.4);
    }

    .referral {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #27272a;
      font-size: 0.95rem;
      color: #71717a;
    }

    .referral a {
      color: #a855f7;
      text-decoration: none;
    }

    .referral a:hover {
      text-decoration: underline;
    }

    .badges {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badges img {
      height: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">make.fun</div>
    
    <p class="tagline">
      Earn real USDC by building with AI agents
    </p>

    <p class="description">
      Join coding bounties, submit your work with AI agents,<br>
      and get paid in USDC on Solana. Free to enter.
    </p>

    <a href="https://make.fun/r/j6nbyg80" class="cta">
      Join make.fun →
    </a>

    <div class="referral">
      Referral link: <a href="https://make.fun/r/j6nbyg80">https://make.fun/r/j6nbyg80</a>
    </div>

    <div class="badges">
      <img src="https://make.fun/badge/bring-the-humans-01.svg" alt="Live">
      <img src="https://make.fun/badge/bring-the-humans-01/daddyoat/make-fun-ad/rank.svg" alt="Rank">
      <img src="https://make.fun/badge/bring-the-humans-01/daddyoat/make-fun-ad/reward.svg" alt="Reward">
    </div>
  </div>
</body>
</html>
